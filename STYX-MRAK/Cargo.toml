[package]
name = "styx-mrak"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "ϟ МРАК — private Discord bot for the STYX Rivals clan"
publish = false

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
serenity = { version = "0.12", default-features = false, features = ["builder", "client", "gateway", "model", "http", "utils", "rustls_backend"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros", "derive", "chrono"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
async-trait = "0.1"
dotenvy = "0.15"
regex = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true

[profile.dev]
debug = 0

[profile.test]
debug = 0
